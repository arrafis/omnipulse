name: OmniPulse morning newsletter

on:
  workflow_dispatch:
  schedule:
    - cron: "13 8-12 * * *"
      timezone: America/Toronto

permissions:
  contents: read

concurrency:
  group: omnipulse-daily-email
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || vars.NEWSLETTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deliver confirmed subscriptions
        env:
          NEWSLETTER_SITE_URL: https://omnipulse.sifath75.chatgpt.site
          NEWSLETTER_JOB_TOKEN: ${{ secrets.NEWSLETTER_JOB_TOKEN }}
        run: node scripts/run-newsletter.mjs
